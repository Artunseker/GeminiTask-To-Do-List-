{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">
            🔐 Welcome Back!
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" class="form-control" name="username" autocomplete="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>🔑 Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        🚀 Login
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <div class="text-center">
                <a href="/auth/register-page" class="btn btn-link">
                    ✨ Don't have an account? Register here!
                </a>
            </div>
        </div>
    </div>
</div>
