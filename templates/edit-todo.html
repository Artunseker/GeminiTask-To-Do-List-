{% include 'layout.html' %}

<div class="container">
  <div class="card">
    <div class="card-header">
      ✏️ Edit Your Todo
    </div>
    <div class="card-body">
      <form id="editTodoForm">
        <div class="form-group">
          <label>📝 Title</label>
          <input type="text" class="form-control" name="title" value="{{todo.title}}" required>
        </div>
        <div class="form-group">
          <label>📄 Description</label>
          <textarea name="description" class="form-control" rows="4" required>{{todo.description}}</textarea>
        </div>
        <div class="form-group">
          <label>⭐ Priority Level</label>
          <select name="priority" class="form-control">
            <option value="1" {% if todo.priority == 1 %} selected="selected" {% endif %}>🔥 Urgent (1)</option>
            <option value="2" {% if todo.priority == 2 %} selected="selected" {% endif %}>⚡ High (2)</option>
            <option value="3" {% if todo.priority == 3 %} selected="selected" {% endif %}>📋 Medium (3)</option>
            <option value="4" {% if todo.priority == 4 %} selected="selected" {% endif %}>📝 Low (4)</option>
            <option value="5" {% if todo.priority == 5 %} selected="selected" {% endif %}>💤 Someday (5)</option>
          </select>
        </div>
        <div class="form-group">
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" name="complete" id="completeCheck" {% if todo.complete %} checked {% endif %}>
            <label class="custom-control-label" for="completeCheck">
              ✅ Mark as Complete
            </label>
          </div>
        </div>
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary btn-lg">
            💾 Save Changes
          </button>
          <button id="deleteButton" type="button" class="btn btn-danger btn-lg">
            🗑️ Delete
          </button>
          <a href="/todo/todo-page" class="btn btn-success btn-lg">
            ↩️ Back to List
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
.custom-control-label {
    font-weight: 600;
    color: var(--dark-text);
    cursor: pointer;
}

.custom-control-input:checked ~ .custom-control-label::before {
    background-color: var(--success-color);
    border-color: var(--success-color);
}
</style>
