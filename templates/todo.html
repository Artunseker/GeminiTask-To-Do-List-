{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">
            <i class="fas fa-tasks"></i> Your Todo's!
        </div>
        <div class="card-body">
            <h5 class="card-title">
                📝 Manage Your Tasks
            </h5>
            <p class="card-text">
                Keep track of everything you need to accomplish
            </p>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">📋 Task</th>
                            <th scope="col">⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for todo in todos %}
                    {% if todo.complete == False %}
                    <tr class="pointer todo-row">
                        <td><span class="badge badge-primary">{{loop.index}}</span></td>
                        <td><strong>{{todo.title}}</strong></td>
                        <td>
                            <button onclick="window.location.href='edit-todo-page/{{todo.id}}'"
                                    type="button" class="btn btn-info btn-sm">
                                ✏️ Edit
                            </button>
                        </td>
                    </tr>
                    {% else %}
                    <tr class="pointer alert alert-success todo-row completed">
                        <td><span class="badge badge-success">{{loop.index}}</span></td>
                        <td class="strike-through-td">✅ {{todo.title}}</td>
                        <td>
                            <button onclick="window.location.href='edit-todo-page/{{todo.id}}'"
                                    type="button" class="btn btn-info btn-sm">
                                ✏️ Edit
                            </button>
                        </td>
                    </tr>
                    {% endif %}
                    {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <a href="add-todo-page" class="btn btn-primary btn-lg">
                    ➕ Add New Todo
                </a>
            </div>
        </div>
    </div>
</div>

<style>
.badge {
    font-size: 0.9rem;
    padding: 0.5rem 0.75rem;
    border-radius: 50px;
}

.todo-row {
    transition: all 0.3s ease;
}

.todo-row:hover {
    transform: translateX(5px);
}

.completed {
    opacity: 0.7;
}
</style>
